[project]
name = "loaded-dice"
version = "0.1.0"
description = "Multiplayer Yahtzee party game — power yourself up and debuff the table"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "fastapi>=0.115", "uvicorn[standard]>=0.30"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
loaded-dice = "loaded_dice.sandbox:main"
loaded-dice-server = "loaded_dice.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
